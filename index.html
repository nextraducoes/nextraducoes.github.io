<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexTraduções</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      max-width: 640px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 28px;
      text-align: center;
    }
    h1 { font-size: 2rem; margin-bottom: 12px; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
    a {
      display: inline-block;
      color: var(--bg);
      background: var(--accent);
      text-decoration: none;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <main>
    <h1>NexTraduções</h1>
    <p>Site oficial em construção. Em breve nossos projetos e traduções estarão disponíveis aqui.</p>
    <a href="https://github.com/nextraducoes" target="_blank" rel="noopener noreferrer">Ver no GitHub</a>
  </main>
</body>
</html>
