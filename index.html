<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexTraduções — Patches para Jogos de PC</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <a href="./" class="brand-title">Nex<span>Traduções</span></a>
        <span class="brand-sub">Patches e traduções para jogos de PC</span>
      </div>
      <div class="header-actions">
        <a href="admin/" class="btn btn-sm">Painel Admin</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-label="Filtros do catálogo">
      <input id="searchInput" class="search-input" type="search" placeholder="Buscar jogo pelo nome ou descrição...">
      <select id="statusFilter" class="select-input" aria-label="Filtrar por status">
        <option value="all">Todos os status</option>
        <option value="Concluído">Concluído</option>
        <option value="Em andamento">Em andamento</option>
        <option value="Beta">Beta</option>
        <option value="Pausado">Pausado</option>
      </select>
    </section>

    <section id="gamesGrid" class="games-grid" aria-live="polite">
      <div class="empty-state" style="grid-column: 1 / -1;">
        <h2>Carregando traduções...</h2>
      </div>
    </section>
  </main>

  <div id="gameModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <button id="modalClose" class="modal-close" aria-label="Fechar">&times;</button>
      <div class="modal-content">
        <div id="modalCover" class="modal-cover"></div>
        <div class="modal-info">
          <div>
            <span id="modalBadge" class="badge"></span>
          </div>
          <h2 id="modalTitle"></h2>
          <div class="info-grid">
            <div class="info-item"><strong>Versão</strong><span id="modalVersao"></span></div>
            <div class="info-item"><strong>Progresso</strong><span id="modalProgresso"></span></div>
            <div class="info-item"><strong>Plataforma</strong><span id="modalPlataforma"></span></div>
            <div class="info-item"><strong>Autor</strong><span id="modalAutor"></span></div>
          </div>
          <div class="section-block">
            <h3>Sobre a tradução</h3>
            <p id="modalDesc"></p>
          </div>
          <div class="section-block">
            <h3>Como instalar</h3>
            <p id="modalInstall"></p>
          </div>
          <div>
            <a id="modalDownload" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer">Baixar Patch</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      NexTraduções &mdash; Hospedado no GitHub Pages
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
